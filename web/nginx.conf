# Même rôle que le proxy de vite.config.ts en dev : le navigateur appelle /api sur le même domaine
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        # Le modèle local peut mettre plus d'une minute à répondre sur CPU
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
