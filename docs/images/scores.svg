<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Des signaux au score d'opportunité</text>

  <!-- Durability -->
  <rect x="20" y="60" width="300" height="250" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="170" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Durability (RG04)</text>
  <text x="170" y="106" text-anchor="middle" font-size="12" fill="#065f46">La tendance va-t-elle durer ?</text>
  <g font-size="13" fill="#064e3b">
    <text x="40" y="136">Persistance</text><rect x="160" y="125" width="120" height="14" fill="#a7f3d0"/><text x="290" y="137">30</text>
    <text x="40" y="164">Régularité</text><rect x="160" y="153" width="80" height="14" fill="#a7f3d0"/><text x="250" y="165">20</text>
    <text x="40" y="192">Diversité</text><rect x="160" y="181" width="80" height="14" fill="#a7f3d0"/><text x="250" y="193">20</text>
    <text x="40" y="220">Diffusion</text><rect x="160" y="209" width="60" height="14" fill="#a7f3d0"/><text x="230" y="221">15</text>
    <text x="40" y="248">Adoption précoce</text><rect x="160" y="237" width="40" height="14" fill="#a7f3d0"/><text x="210" y="249">10</text>
  </g>
  <text x="170" y="280" text-anchor="middle" font-size="12" fill="#065f46">− pénalité pic isolé (5 à 15 pts)</text>
  <text x="170" y="298" text-anchor="middle" font-size="12" fill="#065f46">poids renormalisés si donnée absente</text>

  <!-- Fit -->
  <rect x="350" y="60" width="300" height="250" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Client Fit (RG07)</text>
  <text x="500" y="106" text-anchor="middle" font-size="12" fill="#1e3a8a">Est-ce pour ce client ?</text>
  <g font-size="13" fill="#1e3a8a">
    <text x="370" y="136">Alignement marque</text><rect x="510" y="125" width="100" height="14" fill="#bfdbfe"/><text x="618" y="137">25</text>
    <text x="370" y="161">Cible</text><rect x="510" y="150" width="80" height="14" fill="#bfdbfe"/><text x="598" y="162">20</text>
    <text x="370" y="186">Portefeuille</text><rect x="510" y="175" width="80" height="14" fill="#bfdbfe"/><text x="598" y="187">20</text>
    <text x="370" y="211">Marché</text><rect x="510" y="200" width="60" height="14" fill="#bfdbfe"/><text x="578" y="212">15</text>
    <text x="370" y="236">Potentiel</text><rect x="510" y="225" width="40" height="14" fill="#bfdbfe"/><text x="558" y="237">10</text>
    <text x="370" y="261">Capacité d'agir</text><rect x="510" y="250" width="40" height="14" fill="#bfdbfe"/><text x="558" y="262">10</text>
  </g>
  <text x="500" y="292" text-anchor="middle" font-size="12" fill="#1e3a8a">Priority ≥ 80 · Strong ≥ 65 · Potential ≥ 50</text>

  <!-- Timing -->
  <rect x="680" y="60" width="300" height="250" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="830" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">Market Timing (RG09)</text>
  <text x="830" y="106" text-anchor="middle" font-size="12" fill="#713f12">Est-ce le bon moment, sur ce marché ?</text>
  <g font-size="13" fill="#713f12">
    <text x="700" y="140">Maturité</text><rect x="840" y="129" width="100" height="14" fill="#fde68a"/><text x="948" y="141">40</text>
    <text x="700" y="172">Croissance locale</text><rect x="840" y="161" width="75" height="14" fill="#fde68a"/><text x="923" y="173">30</text>
    <text x="700" y="204">Concurrence</text><rect x="840" y="193" width="50" height="14" fill="#fde68a"/><text x="898" y="205">20</text>
    <text x="700" y="236">Cycle client</text><rect x="840" y="225" width="25" height="14" fill="#fde68a"/><text x="873" y="237">10</text>
  </g>
  <text x="830" y="275" text-anchor="middle" font-size="12" fill="#713f12">+ fenêtre de tir (intervalle, jamais</text>
  <text x="830" y="292" text-anchor="middle" font-size="12" fill="#713f12">une date unique)</text>

  <!-- arrows to opportunity -->
  <line x1="170" y1="312" x2="420" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="312" x2="500" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="830" y1="312" x2="580" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="270" y="335" font-size="13" font-weight="700" fill="#065f46">× 0,45</text>
  <text x="510" y="345" font-size="13" font-weight="700" fill="#1e3a8a">× 0,40</text>
  <text x="690" y="335" font-size="13" font-weight="700" fill="#713f12">× 0,15</text>

  <!-- Opportunity -->
  <rect x="330" y="372" width="340" height="66" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="400" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">Opportunity Score (RG11)</text>
  <text x="500" y="422" text-anchor="middle" font-size="12.5" fill="#4c1d95">+ Confidence (RG12 / RG29) : qualité de la preuve</text>

  <line x1="500" y1="440" x2="500" y2="466" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- buckets -->
  <rect x="80" y="468" width="260" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="210" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">À proposer + alerte</text>
  <text x="210" y="514" text-anchor="middle" font-size="11.5" fill="#14532d">D ≥ 60, Fit ≥ 65, Opp ≥ 70, Conf ≥ 70</text>
  <rect x="370" y="468" width="260" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="500" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">À surveiller</text>
  <text x="500" y="514" text-anchor="middle" font-size="11.5" fill="#713f12">une seule condition manque, écart &lt; 10 pts</text>
  <rect x="660" y="468" width="260" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="790" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Écartée</text>
  <text x="790" y="514" text-anchor="middle" font-size="11.5" fill="#7f1d1d">populaire mais refusée, avec la raison</text>
</svg>
